# Builds the ShrinkIt Windows installers (NSIS .exe + MSI) for x64 and ARM64
# on every push to main, so the app can be downloaded from the Actions tab
# and tested on a real Windows machine. No secrets needed — the installers
# are unsigned (Windows SmartScreen will show an "unknown publisher" prompt
# on install).

name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app (NSIS + MSI)
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis,msi --target ${{ matrix.target }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: shrinkit-windows-${{ matrix.arch }}-nsis
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: shrinkit-windows-${{ matrix.arch }}-msi
          path: src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
