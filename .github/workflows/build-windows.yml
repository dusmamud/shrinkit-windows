# Builds the ShrinkIt Windows installers (NSIS .exe + MSI) on every push to
# main, so the app can be downloaded from the Actions tab and tested on a
# real Windows machine. No secrets needed — the installers are unsigned
# (Windows SmartScreen will show an "unknown publisher" prompt on install).

name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app (NSIS + MSI)
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles nsis,msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: shrinkit-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: shrinkit-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
