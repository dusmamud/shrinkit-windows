[package]
name = "shrinkit-windows"
version = "1.0.0"
description = "ShrinkIt — free, private, client-side image resizer for Windows"
authors = ["ShrinkIt"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
